<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ion's Kitchen</title>
  <meta name="description" content="Ion's recipe book: high-protein dishes from his meal plan.">
  <meta name="theme-color" content="#14110e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ion's Kitchen">

  <!-- Fonts: Fraunces for headings, Outfit for everything else, Caveat for the hand-written word. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">

  <script>
    // Apply the saved theme before the page draws, so it never flashes the wrong colours.
    try {
      if (JSON.parse(localStorage.getItem("ionsKitchen.theme")) === "light") {
        document.documentElement.dataset.theme = "light";
      }
    } catch (error) { /* storage blocked: stay dark */ }
  </script>
</head>
<body>
  <!-- Every page is drawn into this element by js/app.js -->
  <div id="app"></div>

  <!-- Order matters: data first, then helpers, then the app that uses them. -->
  <script src="data/recipes.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/portions.js"></script>
  <script src="js/cooking.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
